<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16362A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Diario de viaje</title>
<link rel="manifest" href="./manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bone:#DDD6C3; --bone2:#EAE5D6; --bone3:#F2EEE2;
  --green:#16362A; --green2:#24503E; --green3:#3A6B54;
  --ochre:#C68A2E; --ochre2:#8F6118;
  --ink:#1A1B17; --mute:#6B6A5E;
  --red:#A8382A;
  --line:rgba(22,54,42,.18);
  --disp:"Barlow Condensed",-apple-system,"Helvetica Neue",sans-serif;
  --body:"IBM Plex Sans",-apple-system,"Helvetica Neue",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bone);color:var(--ink);font-family:var(--body);
  font-size:15px;line-height:1.5;padding-bottom:56px;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}

header{padding:20px 0 12px}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre2);font-weight:600}
h1{font-family:var(--disp);font-weight:700;font-size:38px;line-height:.95;margin:5px 0 0;text-transform:uppercase;color:var(--green)}
.sub{font-family:var(--mono);font-size:11.5px;color:var(--mute);margin-top:6px}

/* placa */
.plate{
  background:var(--green);color:var(--bone3);border-radius:3px;padding:16px 16px 14px;margin:14px 0 0;
  box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 3.5px rgba(242,238,226,.45);
  position:relative;overflow:hidden
}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 78% 0%,rgba(198,138,46,.16),transparent 62%)}
.plate-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plate-day{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;opacity:.72}
.plate-base{font-family:var(--disp);font-weight:700;font-size:29px;line-height:1;text-transform:uppercase;margin:7px 0 0}
.plate-next{margin-top:13px;padding-top:12px;border-top:1px solid rgba(242,238,226,.28);display:flex;gap:12px;align-items:flex-start}
.plate-time{font-family:var(--disp);font-weight:700;font-size:31px;line-height:.9;color:var(--ochre);flex:0 0 auto;min-width:62px}
.plate-what{font-size:14px;line-height:1.35;padding-top:2px}
.plate-when{font-family:var(--mono);font-size:10.5px;opacity:.66;margin-top:3px;letter-spacing:.04em}
.plate-gate{margin-top:12px;padding-top:11px;border-top:1px solid rgba(242,238,226,.28);
  font-family:var(--mono);font-size:11px;display:flex;justify-content:space-between;gap:8px;opacity:.88}
.plate-gate b{color:var(--ochre);font-weight:600}

nav{position:sticky;top:0;z-index:20;background:var(--bone);padding:12px 0 9px;margin-top:16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{font-family:var(--disp);font-weight:600;font-size:15.5px;letter-spacing:.05em;text-transform:uppercase;
  padding:6px 12px;border-radius:2px;border:1px solid var(--line);background:transparent;color:var(--green2);
  cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--green);color:var(--bone3);border-color:var(--green)}
.tab:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

section[hidden]{display:none}
section{padding-top:16px;animation:fade .22s ease both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){section{animation:none}*{transition:none!important}}

h2{font-family:var(--disp);font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ochre2);margin:24px 0 9px;padding-bottom:5px;border-bottom:1px solid var(--line)}
h2:first-child{margin-top:2px}

.leg{margin-bottom:20px}
.leg-head{display:flex;align-items:baseline;gap:9px;margin-bottom:8px}
.leg-mark{font-family:var(--mono);font-weight:600;font-size:10px;letter-spacing:.1em;
  background:var(--green2);color:var(--bone3);padding:3px 6px;border-radius:2px;flex:0 0 auto}
.leg-name{font-family:var(--disp);font-weight:700;font-size:21px;text-transform:uppercase;line-height:1;color:var(--green)}
.leg-dates{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-left:auto;flex:0 0 auto}

.day{background:var(--bone2);border-left:3px solid var(--green3);border-radius:0 3px 3px 0;padding:10px 12px;margin-bottom:6px}
.day.today{border-left-color:var(--ochre);background:var(--bone3);box-shadow:0 1px 0 var(--line)}
.day.past{opacity:.5}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-date{font-family:var(--disp);font-weight:600;font-size:17px;text-transform:uppercase}
.day-tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ochre2)}
.ev{display:flex;gap:10px;margin-top:7px;font-size:13.5px;line-height:1.4}
.ev-t{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--green2);flex:0 0 44px;padding-top:2px}
.ev-x{flex:1}
.ev.key .ev-x{font-weight:600}
.warn{margin-top:8px;background:rgba(168,56,42,.09);border-left:2px solid var(--red);
  padding:7px 9px;font-size:12.5px;line-height:1.4;color:#7A2A20;border-radius:0 2px 2px 0}

.figs{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.fig{background:var(--bone2);border-radius:3px;padding:11px 12px}
.fig.wide{grid-column:1/-1}
.fig.dark{background:var(--green);color:var(--bone3)}
.fig-k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fig.dark .fig-k{color:rgba(242,238,226,.62)}
.fig-v{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.08;margin-top:3px;font-feature-settings:"tnum"}
.fig.dark .fig-v{color:var(--ochre)}
.fig-n{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.35}
.fig.dark .fig-n{color:rgba(242,238,226,.7)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);
  text-align:left;font-weight:600;padding:0 0 6px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--mono);font-size:12.5px;white-space:nowrap;font-feature-settings:"tnum"}
tr.total td{border-bottom:none;border-top:2px solid var(--green);font-weight:600;padding-top:9px}
.pend{color:var(--red);font-weight:500}

.form{background:var(--bone2);border-radius:3px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:7px;margin-bottom:7px}
.row>*{min-width:0}
label{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;font-family:var(--body);font-size:16px;padding:9px 10px;
  border:1px solid var(--line);border-radius:2px;background:var(--bone3);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ochre);outline-offset:-1px;border-color:transparent}
textarea{resize:vertical;min-height:76px;line-height:1.45;font-family:var(--mono);font-size:13px}
button.go{width:100%;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.09em;text-transform:uppercase;
  padding:11px;border:none;border-radius:2px;background:var(--green);color:var(--bone3);cursor:pointer}
button.go.ghost{background:transparent;color:var(--green2);border:1px solid var(--line)}
button.go:active{background:var(--green2)}
button.go:disabled{opacity:.45;cursor:default}
button.go:focus-visible{outline:2px solid var(--ochre);outline-offset:2px}

.item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.item-m{flex:1;min-width:0}
.item-c{font-size:14px;line-height:1.35;word-break:break-word}
.item-d{font-family:var(--mono);font-size:10.5px;color:var(--mute);margin-top:2px;letter-spacing:.03em}
.item-a{font-family:var(--mono);font-size:13.5px;font-weight:500;white-space:nowrap;padding-top:1px;font-feature-settings:"tnum"}
.item-x{background:none;border:none;color:var(--mute);cursor:pointer;font-size:17px;line-height:1;padding:2px 0 2px 7px;flex:0 0 auto}
.item-x:hover{color:var(--red)}
.item.cola{opacity:.62}

.empty{text-align:center;padding:26px 16px;background:var(--bone2);border-radius:3px;font-size:13.5px;color:var(--mute);line-height:1.5}
.note{font-size:12.5px;color:var(--mute);line-height:1.5;margin:9px 0 0}
.msg{font-family:var(--mono);font-size:11px;padding:8px 10px;border-radius:2px;margin-bottom:10px;line-height:1.5}
.msg.bad{background:rgba(168,56,42,.11);color:#7A2A20}
.msg.ok{background:rgba(36,80,62,.11);color:var(--green2)}
.msg.info{background:rgba(198,138,46,.15);color:var(--ochre2)}
.pill{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  padding:2px 6px;border-radius:2px;background:var(--green2);color:var(--bone3);margin-right:5px}
.pill.warnp{background:var(--red)}
.pill.who{background:var(--ochre2)}

.estado{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-align:center;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:var(--green);color:rgba(242,238,226,.85)
}
.estado.pend{background:var(--ochre2);color:#fff}
.estado.off{background:var(--red);color:#fff}

footer{margin-top:34px;padding:16px 0 8px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:10.5px;color:var(--mute);line-height:1.6}

/* Marcado de lo que aún no está contratado */
.ev.pte{
  background:rgba(198,138,46,.15);border-left:2px solid var(--ochre);
  margin-left:-8px;padding:5px 8px;border-radius:0 2px 2px 0
}
.ev.pte .ev-t{color:var(--ochre2)}
.ev.pte .ev-x::after{
  content:" · sin cerrar";font-family:var(--mono);font-size:9.5px;
  letter-spacing:.09em;text-transform:uppercase;color:var(--ochre2);white-space:nowrap
}
.pill.sinp{background:var(--ochre2)}
.leyenda{
  display:flex;align-items:center;gap:7px;margin-bottom:12px;
  font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.03em
}
.leyenda i{
  width:13px;height:13px;border-radius:2px;flex:0 0 auto;display:inline-block;
  background:rgba(198,138,46,.35);border-left:2px solid var(--ochre)
}


/* Mapa ------------------------------------------------------------ */
:root{--maph:62vh}
#lienzo{height:var(--maph);min-height:340px;border:1px solid var(--line);background:var(--bone2)}
.leaflet-container{font-family:var(--body);background:var(--bone2)}
.leaflet-popup-content-wrapper{border-radius:0;background:var(--bone3);border:1px solid var(--line)}
.leaflet-popup-content{margin:11px 13px;font-size:13px;line-height:1.45}
.leaflet-popup-tip{background:var(--bone3)}
.pop-n{font-family:var(--disp);font-weight:700;font-size:18px;text-transform:uppercase;
  line-height:1.05;color:var(--green)}
.pop-z{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ochre2);margin:3px 0 6px}
.pop-e{display:flex;gap:7px;margin-top:4px;font-size:12.5px}
.pop-e b{font-family:var(--mono);font-weight:500;font-size:11px;color:var(--green2);flex:0 0 38px}
.mapa-grid{display:grid;grid-template-columns:1fr 178px;gap:9px;align-items:start}
.dias{display:flex;flex-direction:column;height:var(--maph);min-height:340px;
  border:1px solid var(--line);background:var(--bone3);overflow:hidden}
.dias-h{display:flex;align-items:center;justify-content:space-between;gap:6px;flex:0 0 auto;
  padding:6px 8px;border-bottom:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.dias-h button{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
  padding:3px 7px;border:1px solid var(--line);background:var(--bone2);color:var(--green2);cursor:pointer}
.dias-l{overflow-y:auto;flex:1 1 auto;min-height:0}
.dsel{display:flex;align-items:center;gap:7px;width:100%;text-align:left;cursor:pointer;
  padding:4px 8px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}
.dsel:last-child{border-bottom:0}
.dsel:hover{background:var(--bone2)}
.dsel[aria-pressed="true"]{background:var(--green);color:var(--bone3)}
.dsel i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.dsel-t{display:flex;flex-direction:column;min-width:0}
.dsel-t b{font-family:var(--disp);font-weight:600;font-size:13px;text-transform:uppercase;line-height:1.02}
.dsel-t em{font-family:var(--mono);font-style:normal;font-size:9px;opacity:.72;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mapa-pie{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;
  font-family:var(--mono);font-size:10.5px;color:var(--mute)}
.mapa-pie button{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:6px 11px;border:1px solid var(--line);background:var(--bone3);color:var(--green2);cursor:pointer}
.mapa-pie button[aria-pressed="true"]{background:var(--ochre);color:var(--bone3);border-color:var(--ochre)}
.pista{opacity:.6;margin-left:auto}
.zoombar{background:var(--bone3);border:1px solid var(--line);padding:8px 5px;
  box-shadow:0 1px 4px rgba(22,54,42,.18)}
.zoombar input{-webkit-appearance:slider-vertical;appearance:slider-vertical;
  writing-mode:vertical-lr;direction:rtl;width:16px;height:104px;margin:0;cursor:pointer;
  accent-color:var(--green)}
.zleyenda{display:flex;flex-wrap:wrap;gap:4px 11px;margin-top:9px}
.zleyenda span{font-family:var(--mono);font-size:10px;color:var(--mute);display:flex;align-items:center;gap:5px}
.zleyenda i{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
@media(max-width:640px){
  .mapa-grid{grid-template-columns:1fr}
  #lienzo{height:46vh;min-height:280px}
  .dias{height:auto;min-height:0;max-height:214px}
  .pista{display:none}
}

/* Tabla de detalle, ajustada al ancho de la pantalla */
.tdet{width:100%;border-collapse:collapse;table-layout:fixed}
.tdet col.w-fec{width:44px}
.tdet col.w-zar{width:52px}
.tdet col.w-eur{width:60px}
.tdet th{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute);text-align:left;font-weight:600;padding:0 0 6px;
  border-bottom:1px solid var(--line)
}
.tdet th.r{text-align:right}
.tdet td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tdet .c-fec{
  font-family:var(--mono);font-size:10px;color:var(--green2);
  padding-right:7px;line-height:1.35;white-space:nowrap
}
.tdet .c-con{font-size:12.5px;line-height:1.3;padding-right:8px;word-break:break-word}
.tdet .c-zar{
  text-align:right;font-family:var(--mono);font-size:10.5px;color:var(--mute);
  padding-right:9px;white-space:nowrap;font-feature-settings:"tnum"
}
.tdet .c-eur{
  text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:500;
  white-space:nowrap;font-feature-settings:"tnum"
}
.tdet tr.total td{
  border-bottom:none;border-top:2px solid var(--green);font-weight:600;padding-top:9px
}
.tdet .sub{
  display:block;font-family:var(--mono);font-size:9px;color:var(--mute);
  margin-top:4px;letter-spacing:.03em;line-height:1.4
}
.cat{
  display:inline-block;font-family:var(--mono);font-size:8.5px;font-weight:600;
  letter-spacing:.07em;text-transform:uppercase;padding:1px 4px;border-radius:2px;
  margin-right:5px;vertical-align:1px
}
/* Cinco familias, tonos atenuados de la propia paleta */
.cat.mov{background:rgba(43,50,71,.15);color:#2B3247}
.cat.est{background:rgba(36,80,62,.16);color:#1E4433}
.cat.exp{background:rgba(143,97,24,.18);color:#7A5214}
.cat.tas{background:rgba(168,56,42,.14);color:#8C2F24}
.cat.dia{background:rgba(107,106,94,.18);color:#55544B}

.fams{
  display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px;margin-top:14px;
  padding-top:11px;border-top:1px solid var(--line);
  font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.03em
}
.fams .cat{margin-right:3px}

.barra.mov i{background:#2B3247}
.barra.est i{background:#24503E}
.barra.exp i{background:#8F6118}
.barra.tas i{background:#A8382A}
.barra.dia i{background:#6B6A5E}
th.sortable{cursor:pointer;user-select:none;text-decoration:underline;text-underline-offset:3px}
th.sortable:hover{color:var(--green2)}
.filtros{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
.filtros select{width:auto;flex:1 1 150px;font-size:14px;padding:8px 9px}
/* Barra proporcional por categoría */
.barra{height:3px;background:var(--line);border-radius:2px;margin-top:5px;max-width:190px}
.barra i{display:block;height:100%;background:var(--green3);border-radius:2px}
.pill{font-size:9px;padding:1px 5px;vertical-align:1px}

.item.ret{background:rgba(198,138,46,.09);border-radius:2px;padding-left:7px;padding-right:7px}

.fig.alerta{background:rgba(198,138,46,.20);box-shadow:inset 0 0 0 1px rgba(198,138,46,.5)}
.fig.alerta .fig-v{color:var(--ochre2)}

/* Movimientos de efectivo con saldo acumulado */
.tefe{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:4px}
.tefe col.w-fec{width:42px}
.tefe col.w-imp{width:54px}
.tefe col.w-sal{width:56px}
.tefe th{
  font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--mute);text-align:left;font-weight:600;padding:0 0 6px;
  border-bottom:1px solid var(--line)
}
.tefe th.r{text-align:right}
.tefe td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tefe .c-fec{font-family:var(--mono);font-size:10px;color:var(--green2);padding-right:6px;white-space:nowrap}
.tefe .c-con{font-size:12px;line-height:1.3;padding-right:8px;word-break:break-word}
.tefe .c-imp{
  text-align:right;font-family:var(--mono);font-size:11px;color:var(--mute);
  padding-right:9px;white-space:nowrap;font-feature-settings:"tnum"
}
.tefe .c-sal{
  text-align:right;font-family:var(--mono);font-size:12.5px;font-weight:600;
  white-space:nowrap;font-feature-settings:"tnum"
}
.tefe .sub{
  display:block;font-family:var(--mono);font-size:8.5px;color:var(--ochre2);
  letter-spacing:.08em;text-transform:uppercase;margin-top:3px
}
.tefe tr.hecho .c-con{color:var(--mute)}
.tefe tr.hecho .c-sal{font-weight:500}
.tefe tr.seco .c-sal{color:var(--red)}
.tefe tr.seco{background:rgba(168,56,42,.08)}

/* Entradas del diario */
.nota{
  position:relative;background:var(--bone2);border-left:3px solid var(--ochre);
  border-radius:0 3px 3px 0;padding:11px 13px;margin-bottom:7px
}
.nota.cola{opacity:.65;border-left-style:dotted}

<div class="estado" id="estado"></div>
<script>
/* =========================================================
   Diario de viaje — motor genérico
   Los datos viven en /data/<viaje>/viaje.json y gastos-<persona>.json
   ========================================================= */

const params    = new URLSearchParams(location.search);
const VIAJE_ID  = params.get("viaje") || "sudafrica-2026";
const BASE_DATA = "../data/" + VIAJE_ID + "/";

const LS_CFG  = "diario:cfg";
const LS_COLA = "diario:cola:" + VIAJE_ID;
const LS_SNAP = "diario:snap:" + VIAJE_ID;
const LS_COLAD = "diario:colad:" + VIAJE_ID;

/* Instantánea local: lo último que se cargó bien.
   Es lo que se usa cuando no hay cobertura. */
let snap = { viaje:null, gastos:[], ts:null };
function cargarSnap(){
  try{
    const raw = localStorage.getItem(LS_SNAP);
    if(raw) snap = Object.assign(snap, JSON.parse(raw));
  }catch(e){}
}
function guardarSnap(){
  try{
    snap.ts = Date.now();
    localStorage.setItem(LS_SNAP, JSON.stringify(snap));
  }catch(e){}
}

let V = null;               // viaje.json
let gastos = [];            // confirmados, de todos los viajeros
let cola = [];              // gastos pendientes de subir
let diario = [];            // entradas del diario, de todos los viajeros
let colaD = [];             // entradas del diario pendientes de subir
let cfg = { owner:"", repo:"", rama:"main", quien:"", token:"" };
let mensaje = null;

/* ---------------- utilidades ---------------- */
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

/* El formato español no agrupa los números de cuatro cifras, así que
   se agrupa a mano para que 7909,70 salga como 7.909,70 */
function n2(v){
  const x = Number(v) || 0;
  const p = Math.abs(x).toFixed(2).split(".");
  const ent = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return (x < 0 ? "-" : "") + ent + "," + p[1];
}

function base(n){ return n2(n) + " €"; }

/* Sin decimales, agrupado. Para tablas donde los céntimos estorban. */
function n0(v){
  return String(Math.round(Number(v) || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ".");
}
/* Fecha corta: "7 ago" */
function fmtCorta(iso){
  const [y,m,d] = String(iso).split("-").map(Number);
  const mes = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return d + " " + mes[m-1];
}
const CAT3 = {
  "Vuelos":"VUE", "Alojamiento":"ALO", "Actividades":"ACT", "Tasas":"TAS",
  "Coche":"COC", "Comida":"COM", "Transporte":"TRA", "Combustible":"CMB",
  "Propinas":"PRO", "Souvenirs":"SOU", "Salud":"SAL", "Otros":"OTR"
};
const cat3 = c => CAT3[c] || String(c).slice(0,3).toUpperCase();

/* Familias de categoría. Cinco tonos en vez de doce: el color dice
   de qué tipo de gasto se trata, no cuál exactamente. */
const CATFAM = {
  "Vuelos":"mov", "Coche":"mov", "Transporte":"mov", "Combustible":"mov",
  "Alojamiento":"est",
  "Actividades":"exp",
  "Tasas":"tas",
  "Comida":"dia", "Propinas":"dia", "Souvenirs":"dia", "Salud":"dia", "Otros":"dia"
};
const catFam = c => CATFAM[c] || "dia";

function cambio(codigo){
  if(!V || codigo === V.monedaBase) return 1;
  const c = (V.cambios || []).find(x => x.codigo === codigo);
  return c ? c.porUnidadBase : 1;
}
function aBase(importe, moneda){ return importe / cambio(moneda); }
function fmtMoneda(importe, moneda){
  if(!V || moneda === V.monedaBase) return base(importe);
  const c = (V.cambios || []).find(x => x.codigo === moneda);
  return (c && c.simbolo ? c.simbolo + " " : moneda + " ") + n2(importe);
}

function hoyISO(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtFecha(iso){
  const [y,m,d] = String(iso).split("-").map(Number);
  const dt = new Date(y, m-1, d);
  const dias = ["dom","lun","mar","mié","jue","vie","sáb"];
  const mes  = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
  return dias[dt.getDay()] + " " + d + " " + mes[m-1];
}

/* ---------------- configuración local ---------------- */
function cargarCfg(){
  try{
    const raw = localStorage.getItem(LS_CFG);
    if(raw) cfg = Object.assign(cfg, JSON.parse(raw));
  }catch(e){}
}
function guardarCfg(){
  try{ localStorage.setItem(LS_CFG, JSON.stringify(cfg)); }catch(e){}
}
function cargarCola(){
  try{ cola  = JSON.parse(localStorage.getItem(LS_COLA)  || "[]"); }catch(e){ cola  = []; }
  try{ colaD = JSON.parse(localStorage.getItem(LS_COLAD) || "[]"); }catch(e){ colaD = []; }
}
function guardarCola(){
  try{ localStorage.setItem(LS_COLA,  JSON.stringify(cola));  }catch(e){}
  try{ localStorage.setItem(LS_COLAD, JSON.stringify(colaD)); }catch(e){}
}
const configurado = () => cfg.owner && cfg.repo && cfg.quien;

/* ---------------- GitHub ---------------- */
const API = "https://api.github.com";

function rutaGastos(quien){
  const v = (V.viajeros || []).find(x => x.id === quien);
  return "data/" + VIAJE_ID + "/" + (v && v.fichero ? v.fichero : "gastos-" + quien + ".json");
}
function rutaDiario(quien){
  const v = (V.viajeros || []).find(x => x.id === quien);
  return "data/" + VIAJE_ID + "/" + (v && v.ficheroDiario ? v.ficheroDiario : "diario-" + quien + ".json");
}
function cabeceras(){
  const h = { "Accept":"application/vnd.github+json" };
  if(cfg.token) h["Authorization"] = "Bearer " + cfg.token;
  return h;
}
function b64(str){
  return btoa(String.fromCharCode(...new TextEncoder().encode(str)));
}
function deB64(str){
  const bin = atob(String(str).replace(/\n/g, ""));
  return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
}

async function leerFicheroRepo(ruta){
  const url = API + "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/"
            + ruta + "?ref=" + encodeURIComponent(cfg.rama || "main");
  const r = await fetch(url, { headers: cabeceras(), cache:"no-store" });
  if(r.status === 404) return { contenido: [], sha: null };
  if(!r.ok) throw new Error("GitHub " + r.status);
  const j = await r.json();
  return { contenido: JSON.parse(deB64(j.content) || "[]"), sha: j.sha };
}

async function escribirFicheroRepo(ruta, datos, sha, msg){
  const url = API + "/repos/" + cfg.owner + "/" + cfg.repo + "/contents/" + ruta;
  const r = await fetch(url, {
    method:"PUT",
    headers: Object.assign({ "Content-Type":"application/json" }, cabeceras()),
    body: JSON.stringify({
      message: msg,
      content: b64(JSON.stringify(datos, null, 2) + "\n"),
      sha: sha || undefined,
      branch: cfg.rama || "main"
    })
  });
  if(!r.ok){
    const t = await r.text();
    throw new Error("GitHub " + r.status + ": " + t.slice(0,200));
  }
  return r.json();
}

/* ---------------- carga de datos ---------------- */
async function cargarViaje(){
  try{
    const r = await fetch(BASE_DATA + "viaje.json", { cache:"no-cache" });
    if(!r.ok) throw new Error("respuesta " + r.status);
    V = await r.json();
    snap.viaje = V;
    guardarSnap();
  }catch(e){
    if(snap.viaje){ V = snap.viaje; }
    else throw new Error("No se pudo leer viaje.json y no hay copia guardada");
  }
}

async function cargarGastos(){
  const viajeros = V.viajeros || [];
  const salida = [];
  let fallo = false;

  for(const v of viajeros){
    let lista = null;
    if(configurado()){
      try{ lista = (await leerFicheroRepo(rutaGastos(v.id))).contenido || []; }catch(e){}
    }
    if(lista === null){
      try{
        const r = await fetch(BASE_DATA + v.fichero, { cache:"no-cache" });
        if(r.ok) lista = await r.json();
      }catch(e){}
    }
    if(lista === null){ fallo = true; continue; }
    lista.forEach(g => salida.push(Object.assign({ quien: v.id }, g)));
  }

  if(fallo && snap.gastos && snap.gastos.length){
    gastos = snap.gastos;               // sin red: lo último que sabíamos
  }else{
    gastos = salida;
    snap.gastos = salida;
    guardarSnap();
  }
}

async function cargarDiario(){
  const salida = [];
  let fallo = false;
  for(const v of (V.viajeros || [])){
    let lista = null;
    if(configurado()){
      try{ lista = (await leerFicheroRepo(rutaDiario(v.id))).contenido || []; }catch(e){}
    }
    if(lista === null){
      try{
        const r = await fetch(BASE_DATA + (v.ficheroDiario || "diario-" + v.id + ".json"),
                              { cache:"no-cache" });
        if(r.ok) lista = await r.json();
      }catch(e){}
    }
    if(lista === null){ fallo = true; continue; }
    lista.forEach(x => salida.push(Object.assign({ quien: v.id }, x)));
  }
  if(fallo && snap.diario && snap.diario.length){
    diario = snap.diario;
  }else{
    diario = salida;
    snap.diario = salida;
    guardarSnap();
  }
}

async function vaciarColaDiario(){
  if(!colaD.length || !configurado() || !cfg.token || !navigator.onLine) return;
  try{
    const ruta = rutaDiario(cfg.quien);
    const { contenido, sha } = await leerFicheroRepo(ruta);
    const ids = new Set(contenido.map(x => x.id));
    const nuevos = colaD.filter(x => !ids.has(x.id));
    const salida = contenido.concat(nuevos)
      .sort((a,b) => String(a.fecha).localeCompare(b.fecha) || String(a.id).localeCompare(b.id));
    await escribirFicheroRepo(ruta, salida, sha,
      nuevos.length === 1 ? "Diario: " + nuevos[0].texto.slice(0,50)
                          : nuevos.length + " entradas de diario");
    colaD = [];
    guardarCola();
    await cargarDiario();
  }catch(e){
    mensaje = { tipo:"bad", texto:"No se pudo subir el diario: " + e.message };
  }
}

/* Deja en caché todo lo necesario para abrir sin cobertura */
async function prepararSinConexion(){
  const rutas = [BASE_DATA + "viaje.json"]
    .concat((V.viajeros || []).map(v => BASE_DATA + v.fichero))
    .concat((V.viajeros || []).map(v => BASE_DATA + (v.ficheroDiario || "")).filter(x => x.slice(-5) === ".json"));
  for(const r of rutas){
    try{ await fetch(r, { cache:"reload" }); }catch(e){}
  }
  await cargarGastos();
}

/* ---------------- cola sin conexión ---------------- */
async function vaciarCola(){
  if(!cola.length || !configurado() || !cfg.token || !navigator.onLine) return;
  const mios = cola.slice();
  try{
    const ruta = rutaGastos(cfg.quien);
    const { contenido, sha } = await leerFicheroRepo(ruta);
    const ids = new Set(contenido.map(g => g.id));
    const nuevos = mios.filter(g => !ids.has(g.id));
    const salida = contenido.concat(nuevos)
      .sort((a,b) => String(a.fecha).localeCompare(b.fecha) || String(a.id).localeCompare(b.id));
    await escribirFicheroRepo(ruta, salida, sha,
      nuevos.length === 1
        ? "Gasto: " + nuevos[0].concepto
        : nuevos.length + " gastos de " + cfg.quien);
    cola = [];
    guardarCola();
    await cargarGastos();
  }catch(e){
    mensaje = { tipo:"bad", texto:"No se pudo subir: " + e.message };
  }
}

/* =========================================================
   RENDER
   ========================================================= */
function todosLosDias(){
  const out = [];
  (V.tramos || []).forEach(t => (t.dias || []).forEach(d => out.push(d)));
  return out;
}
function proximoEvento(){
  const ahora = new Date(), lista = [];
  todosLosDias().forEach(d => (d.eventos || []).forEach(e => {
    if(!e.hora) return;
    const [y,mo,da] = d.fecha.split("-").map(Number);
    const [h,mi]    = e.hora.split(":").map(Number);
    lista.push({ when:new Date(y,mo-1,da,h,mi), texto:e.texto, fecha:d.fecha, hora:e.hora });
  }));
  lista.sort((a,b) => a.when - b.when);
  return lista.find(e => e.when > ahora) || null;
}
function cuentaAtras(when){
  const ms = when - new Date();
  if(ms < 0) return "";
  const h = Math.floor(ms/3600000), m = Math.floor(ms % 3600000 / 60000);
  if(h >= 48) return "en " + Math.floor(h/24) + " días";
  if(h >= 1)  return "en " + h + " h " + String(m).padStart(2,"0") + " min";
  return "en " + m + " min";
}

function pintarCabecera(){
  document.getElementById("eyebrow").textContent = V.eyebrow || "";
  document.getElementById("titulo").textContent  = V.titulo || "Viaje";
  document.getElementById("sub").textContent     = V.subtitulo || "";
  document.title = V.titulo || "Diario de viaje";
  pintarPlaca();
}

function pintarPlaca(){
  const hoy   = hoyISO();
  const bases = V.bases || {};
  const lugar = bases[hoy] || "Fuera de fechas";
  const ev    = proximoEvento();

  let next = '<div class="plate-next"><div class="plate-what">Sin nada más en la agenda.</div></div>';
  if(ev){
    next = '<div class="plate-next"><div class="plate-time">' + esc(ev.hora) + '</div><div>'
         + '<div class="plate-what">' + esc(ev.texto) + '</div>'
         + '<div class="plate-when">' + (ev.fecha === hoy ? "hoy" : fmtFecha(ev.fecha))
         + " · " + cuentaAtras(ev.when) + '</div></div></div>';
  }

  let franja = "";
  (V.franjas || []).forEach(f => {
    if(hoy >= f.desde && hoy <= f.hasta){
      franja = '<div class="plate-gate"><span>' + esc(f.etiqueta) + '</span><span>'
             + esc(f.detalle).replace(/(\d{2}:\d{2})/g, "<b>$1</b>") + '</span></div>';
    }
  });

  document.getElementById("plate").innerHTML =
    '<div class="plate-top"><span class="plate-day">' + fmtFecha(hoy) + '</span>'
    + '<span class="plate-day">' + (bases[hoy] ? "base" : "") + '</span></div>'
    + '<div class="plate-base">' + esc(lugar) + '</div>' + next + franja;
}

function tarjetaDia(d, hoy){
  const cls = d.fecha === hoy ? "day today" : (d.fecha < hoy ? "day past" : "day");
  const evs = (d.eventos || []).map(e =>
    '<div class="ev' + (e.clave ? " key" : "") + (e.pte ? " pte" : "") + '">'
    + '<div class="ev-t">' + esc(e.hora || "—") + '</div>'
    + '<div class="ev-x">' + esc(e.texto) + '</div></div>').join("");
  const w = d.aviso ? '<div class="warn">' + esc(d.aviso) + '</div>' : "";
  return '<div class="' + cls + '"><div class="day-h">'
       + '<span class="day-date">' + fmtFecha(d.fecha) + '</span>'
       + '<span class="day-tag">' + esc(d.etiqueta || "") + '</span></div>' + evs + w + '</div>';
}

function listaGastos(){
  return gastos.concat(cola.map(g => Object.assign({ quien:cfg.quien, _cola:true }, g)));
}
/* Una retirada no es un gasto: solo mueve dinero de la tarjeta al bolsillo.
   Lo que sí es gasto es la comisión, que se apunta aparte. */
const esRetirada = g => g.medio === "Retirada";
const esRecarga  = g => g.medio === "Recarga";
const esIngreso  = g => g.medio === "Ingreso";   // efectivo que entra de fuera
const esMovim    = g => esRetirada(g) || esRecarga(g) || esIngreso(g);
function soloGastos(){ return listaGastos().filter(g => !esMovim(g)); }
const zarDe = x => x.moneda === "ZAR" ? x.importe : x.importe * cambio("ZAR");
/* Cuenta en rands de la tarjeta: recargas menos retiradas y menos pagos en rands.
   Los gastos en euros van por otra tarjeta, así que no cuentan aquí. */
function libroTarjeta(){
  const m = [];
  listaGastos().forEach(g => {
    if(esRecarga(g))                  m.push({ f:g.fecha, c:g.concepto, i: zarDe(g),  hecho:true });
    else if(esRetirada(g))            m.push({ f:g.fecha, c:g.concepto, i:-zarDe(g),  hecho:true });
    else if(g.medio === "Tarjeta" && g.moneda === "ZAR")
                                      m.push({ f:g.fecha, c:g.concepto, i:-zarDe(g),  hecho:true });
  });
  (V.reservas || []).forEach(r => {
    if((r.estado === "pendiente" || r.estado === "estimado")
       && r.medio === "Tarjeta" && r.moneda === "ZAR"){
      m.push({ f:r.fecha, c:r.concepto, i:-zarDe(r), hecho:false });
    }
  });
  m.sort((a,b) => String(a.f).localeCompare(String(b.f)) || (b.i - a.i));
  let s = 0;
  m.forEach(x => { s += x.i; x.saldo = s; });
  return m;
}
function tarjeta(){
  const m = libroTarjeta();
  const saldo = m.filter(x => x.hecho).reduce((s,x) => s + x.i, 0);
  const pend  = -m.filter(x => !x.hecho).reduce((s,x) => s + x.i, 0);
  return { saldo, pend, margen: saldo - pend, mov: m };
}

/* Movimientos de efectivo en orden de fecha, con el saldo tras cada uno.
   Mezcla lo ya hecho (retiradas y pagos) con lo previsto (reservas pendientes). */
function libroEfectivo(){
  const m = [];
  listaGastos().forEach(g => {
    const zar = g.moneda === "ZAR" ? g.importe : g.importe * cambio("ZAR");
    if(esRetirada(g) || esIngreso(g)) m.push({ f:g.fecha, c:g.concepto, i: zar,  hecho:true });
    else if(g.medio === "Efectivo")   m.push({ f:g.fecha, c:g.concepto, i:-zar, hecho:true });
  });
  (V.reservas || []).forEach(r => {
    if((r.estado === "pendiente" || r.estado === "estimado") && r.medio === "Efectivo"){
      m.push({ f:r.fecha, c:r.concepto,
               i: -(r.moneda === "ZAR" ? r.importe : r.importe * cambio("ZAR")),
               hecho:false });
    }
  });
  m.sort((a,b) => String(a.f).localeCompare(String(b.f))
                || (b.i - a.i));          // las entradas antes que las salidas del mismo día
  let s = 0;
  m.forEach(x => { s += x.i; x.saldo = s; });
  return m;
}

/* Lo que queda por pagar en metálico, según el medio previsto en cada reserva */
function efectivoPendiente(){
  return (V.reservas || [])
    .filter(r => (r.estado === "pendiente" || r.estado === "estimado") && r.medio === "Efectivo")
    .map(r => ({ concepto:r.concepto, fecha:r.fecha,
                 zar: r.moneda === "ZAR" ? r.importe : r.importe * cambio("ZAR") }))
    .sort((a,b) => String(a.fecha).localeCompare(String(b.fecha)));
}
function efectivo(){
  const sacado  = listaGastos().filter(g => esRetirada(g) || esIngreso(g))
    .reduce((s,g) => s + (g.moneda === "ZAR" ? g.importe : g.importe * cambio("ZAR")), 0);
  const gastado = listaGastos().filter(g => g.medio === "Efectivo")
    .reduce((s,g) => s + (g.moneda === "ZAR" ? g.importe : g.importe * cambio("ZAR")), 0);
  const pend = efectivoPendiente().reduce((s,x) => s + x.zar, 0);
  const mano = sacado - gastado;
  return { sacado, gastado, mano, pend, margen: mano - pend };
}
/* Cuánto sacar la próxima vez: lo que falta, más un colchón, redondeado a 500 */
function sugerirRetirada(margen, colchon){
  const falta = -margen + (colchon || 800);
  return falta <= 0 ? 0 : Math.ceil(falta / 500) * 500;
}
function totalGastos(f){
  return soloGastos().filter(f || (() => true))
    .reduce((s,g) => s + aBase(g.importe, g.moneda), 0);
}

/* =========================================================
   Mapa — Leaflet y OpenStreetMap, ambos cargados a demanda.
   Nada de esto se descarga hasta que se abre la pestaña.
   ========================================================= */
const LEAFLET = "https://unpkg.com/leaflet@1.9.4/dist/leaflet";
let L_ok = false, mapa = null, gPuntos = null, gTraza = null;
let track = null, verTraza = false, mapaMontado = false;

/* Los días se identifican por índice, no por fecha: el 8 de agosto
   son dos jornadas distintas y por fecha se seleccionarían juntas. */
let sel = new Set();          // vacío = el viaje entero
let ancla = null;             // para seleccionar rangos con mayúsculas

function cargarLeaflet(){
  if(L_ok) return Promise.resolve();
  return new Promise((ok, fail) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = LEAFLET + ".css";
    document.head.appendChild(css);
    const js = document.createElement("script");
    js.src = LEAFLET + ".js";
    js.onload  = () => { L_ok = true; ok(); };
    js.onerror = () => fail(new Error("no se pudo descargar Leaflet"));
    document.head.appendChild(js);
  });
}

async function cargarTrack(){
  if(track) return track;
  const r = await fetch(BASE_DATA + "track.json", { cache:"force-cache" });
  if(!r.ok) throw new Error("respuesta " + r.status);
  track = await r.json();
  return track;
}

const colorZona  = z => (V.zonas && V.zonas[z]) ? V.zonas[z].color : "#6B6A5E";
const nombreZona = z => (V.zonas && V.zonas[z]) ? V.zonas[z].nombre : z;
const zonaDe     = k => (V.lugares && V.lugares[k]) ? V.lugares[k].zona : "";

/* Sólo los días que tienen algo que enseñar, con su índice estable */
function diasConMapa(){
  return todosLosDias().map((d, i) => ({ i, d }))
                       .filter(x => (x.d.lugares || []).length);
}
function diasElegidos(){
  const todos = diasConMapa();
  return sel.size ? todos.filter(x => sel.has(x.i)) : todos;
}

function lugaresVisibles(){
  const vistos = new Set();
  diasElegidos().forEach(x => (x.d.lugares || []).forEach(k => vistos.add(k)));
  return [...vistos];
}
function eventosDe(clave){
  const out = [];
  diasElegidos().forEach(x => (x.d.eventos || []).forEach(e => {
    if(e.lugar === clave) out.push({ hora:e.hora, texto:e.texto, fecha:x.d.fecha });
  }));
  return out;
}

/* ---- pintado de capas ---- */
function dibujarPuntos(encuadrar){
  if(!mapa) return;
  if(gPuntos) mapa.removeLayer(gPuntos);
  const marcas = [];
  lugaresVisibles().forEach(k => {
    const l = V.lugares[k];
    if(!l || l.lat == null) return;
    const c = colorZona(l.zona), menor = !!l.menor;
    const m = L.circleMarker([l.lat, l.lon], {
      radius: menor ? 5 : 8, color:c, weight:2,
      fillColor:c, fillOpacity: menor ? .35 : .75
    });
    const evs = eventosDe(k).map(e =>
      '<div class="pop-e"><b>' + esc(e.hora || "—") + '</b><span>'
      + esc(e.texto) + '</span></div>').join("");
    m.bindPopup('<div class="pop-n">' + esc(l.nombre) + '</div>'
      + '<div class="pop-z">' + esc(nombreZona(l.zona)) + '</div>' + evs);
    marcas.push(m);
  });
  gPuntos = L.layerGroup(marcas).addTo(mapa);
  if(encuadrar && marcas.length){
    mapa.fitBounds(L.featureGroup(marcas).getBounds(), { padding:[34,34], maxZoom:14 });
  }
}

/* La traza real del móvil: sale del track, no del itinerario */
async function dibujarTraza(){
  if(gTraza){ mapa.removeLayer(gTraza); gTraza = null; }
  if(!verTraza) return;
  const t = await cargarTrack();
  const fechas = new Set(diasElegidos().map(x => x.d.fecha));
  const lineas = [];
  t.forEach(s => {
    if(!s.timelinePath || !fechas.has(s.startTime.slice(0,10))) return;
    const pts = s.timelinePath.map(p =>
      p.point.replace("geo:","").split(",").map(Number));
    if(pts.length > 1) lineas.push(L.polyline(pts, {
      color:"#C68A2E", weight:2.5, opacity:.75, smoothFactor:1.4 }));
  });
  if(lineas.length) gTraza = L.layerGroup(lineas).addTo(mapa);
}

/* ---- lista lateral de días ---- */
function listaDias(){
  return diasConMapa().map(x => {
    const z = x.d.zona || "";
    return '<button class="dsel" data-i="' + x.i + '" aria-pressed="'
      + (sel.has(x.i)) + '">'
      + '<i style="background:' + colorZona(z) + '"></i>'
      + '<span class="dsel-t"><b>' + esc(fmtCorta(x.d.fecha)) + '</b>'
      + '<em>' + esc(x.d.etiqueta || nombreZona(z)) + '</em></span></button>';
  }).join("");
}

function refrescarLista(){
  document.querySelectorAll("#p-mapa .dsel").forEach(b =>
    b.setAttribute("aria-pressed", sel.has(Number(b.dataset.i))));
  const n = sel.size;
  const et = document.getElementById("dsel-n");
  if(et) et.textContent = n ? (n === 1 ? "1 día" : n + " días") : "viaje entero";
  const nota = document.getElementById("mnota");
  if(nota) nota.textContent = lugaresVisibles().length + " lugares";
  const ley = document.getElementById("zley");
  if(ley) ley.innerHTML = [...new Set(lugaresVisibles().map(zonaDe))].filter(Boolean)
    .map(z => '<span><i style="background:' + colorZona(z) + '"></i>'
      + esc(nombreZona(z)) + '</span>').join("");
}

async function actualizar(encuadrar){
  refrescarLista();
  dibujarPuntos(encuadrar);
  try{ await dibujarTraza(); }catch(e){}
}

function marcoMapa(){
  return '<h2>Dónde</h2>'
    + '<div class="mapa-grid">'
      + '<div id="lienzo"></div>'
      + '<aside class="dias">'
        + '<div class="dias-h"><span id="dsel-n">viaje entero</span>'
        + '<button id="dtodo">Todos</button></div>'
        + '<div class="dias-l">' + listaDias() + '</div>'
      + '</aside>'
    + '</div>'
    + '<div class="mapa-pie">'
      + '<button id="btraza" aria-pressed="' + verTraza + '">Traza real</button>'
      + '<span id="mnota">' + lugaresVisibles().length + ' lugares</span>'
      + '<span class="pista">Mayúsculas para elegir un rango</span></div>'
    + '<div class="zleyenda" id="zley"></div>';
}

function engancharMapa(){
  const idx = () => diasConMapa().map(x => x.i);
  document.querySelectorAll("#p-mapa .dsel").forEach(b => b.onclick = ev => {
    const i = Number(b.dataset.i), orden = idx();
    if(ev.shiftKey && ancla != null){
      const a = orden.indexOf(ancla), z = orden.indexOf(i);
      if(a > -1 && z > -1){
        sel = new Set(orden.slice(Math.min(a,z), Math.max(a,z) + 1));
      }
    }else{
      sel.has(i) ? sel.delete(i) : sel.add(i);
      ancla = i;
    }
    actualizar(true);
  });
  document.getElementById("dtodo").onclick = () => {
    sel.clear(); ancla = null; actualizar(true);
  };
  document.getElementById("btraza").onclick = async function(){
    verTraza = !verTraza;
    this.setAttribute("aria-pressed", verTraza);
    const nota = document.getElementById("mnota");
    if(verTraza && !track && nota) nota.textContent = "cargando la traza…";
    try{ await dibujarTraza(); }
    catch(e){ if(nota) nota.textContent = "no se pudo cargar la traza"; return; }
    refrescarLista();
  };
}

/* Barra de zoom: la misma acción que + y -, pero de un gesto */
function barraZoom(){
  return new (L.Control.extend({
    options:{ position:"topleft" },
    onAdd: function(m){
      const d = L.DomUtil.create("div", "zoombar");
      d.innerHTML = '<input type="range" aria-label="Zoom" min="' + m.getMinZoom()
        + '" max="' + m.getMaxZoom() + '" step="1" value="' + m.getZoom() + '">';
      const r = d.querySelector("input");
      L.DomEvent.disableClickPropagation(d);
      L.DomEvent.on(r, "input", () => m.setZoom(Number(r.value)));
      m.on("zoomend", () => { r.value = m.getZoom(); });
      return d;
    }
  }))();
}

async function pintarMapa(){
  const sec = document.getElementById("p-mapa");
  /* Al arrancar se pintan todos los paneles. Este no: esperaría a
     descargar Leaflet sin que nadie lo haya pedido. */
  if(sec.hidden || mapaMontado) return;

  if(!V.lugares || !Object.keys(V.lugares).length){
    sec.innerHTML = '<div class="empty">Este viaje todavía no tiene lugares con coordenadas.</div>';
    return;
  }
  sec.innerHTML = marcoMapa();
  engancharMapa();

  try{ await cargarLeaflet(); }
  catch(e){
    document.getElementById("lienzo").innerHTML =
      '<div class="empty" style="padding:34px 16px">El mapa necesita conexión.<br>'
      + 'El resto de la app funciona sin ella.</div>';
    return;
  }
  mapa = L.map("lienzo", { scrollWheelZoom:false, zoomControl:false });
  barraZoom().addTo(mapa);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:18, attribution:"&copy; OpenStreetMap"
  }).addTo(mapa);
  mapaMontado = true;
  await actualizar(true);
}

async function anadirGasto(){
  const c = document.getElementById("g-c").value.trim();

    return pintarGastos();
  }
  mensaje = null;
  cola.push({
    id: cfg.quien.slice(0,1) + "-" + Date.now(),
    fecha: document.getElementById("g-f").value || hoyISO(),
    categoria: document.getElementById("g-cat").value,
    concepto: c,
    tercero: (document.getElementById("g-ter").value || "").trim(),
    medio: document.getElementById("g-med").value,
    importe: i,
    moneda: document.getElementById("g-m").value
  });
  guardarCola();
  repintar();
  await vaciarCola();
  repintar();
}

/* Libro unificado: reservas y gastos en una sola lista */
function libro(){
  const R = (V.reservas || []).filter(r => r.estado !== "deposito").map((r,i) => ({
    id:"r"+i, tipo:"Reserva", fecha:r.fecha || V.inicio, concepto:r.concepto,
    tercero:r.proveedor || "—", categoria:r.categoria || "Otros",
    importe:r.importe, moneda:r.moneda, estado:r.estado, nota:r.nota || "",
    quien:r.pagadoPor || null
  }));
  const G = soloGastos().map(g => ({
    id:g.id, tipo:"Gasto", fecha:g.fecha, concepto:g.concepto,
    tercero:g.tercero || "—", categoria:g.categoria,
    importe:g.importe, moneda:g.moneda,
    estado: g._cola ? "sin subir" : "pagado", nota:"",
    quien: g.pagadoPor || g.quien
  }));
  return R.concat(G);
}
function sumaPorEstado(est){
  return libro().filter(x => x.estado === est)
                .reduce((s,x) => s + aBase(x.importe, x.moneda), 0);
}

let ordCol = "fecha", ordDir = 1, fCat = "", fTipo = "", fEstado = "";

function pintarDetalle(){
  let filas = libro();
  if(fCat)    filas = filas.filter(x => x.categoria === fCat);
  if(fTipo)   filas = filas.filter(x => x.tipo === fTipo);
  if(fEstado) filas = filas.filter(x => x.estado === fEstado);

  filas.sort((a,b) => {
    let d;
    if(ordCol === "importe")        d = aBase(a.importe,a.moneda) - aBase(b.importe,b.moneda);
    else if(ordCol === "concepto")  d = a.concepto.localeCompare(b.concepto,"es");
    else if(ordCol === "categoria") d = a.categoria.localeCompare(b.categoria,"es");
    else                            d = String(a.fecha).localeCompare(String(b.fecha));
    return d * ordDir || String(a.fecha).localeCompare(String(b.fecha));
  });

  const tot  = filas.reduce((s,x) => s + aBase(x.importe,x.moneda), 0);
  const totZ = filas.filter(x => x.moneda === "ZAR").reduce((s,x) => s + x.importe, 0);

    + (sel === v ? " selected" : "") + '>' + esc(txt) + '</option>';

  const flecha = c => ordCol === c ? (ordDir === 1 ? " ↑" : " ↓") : "";
  const th = (c,txt,cls) => '<th class="sortable ' + (cls||"") + '" data-ord="' + c + '">'
    + esc(txt) + flecha(c) + '</th>';

  const colorEstado = {
    "pendiente":"var(--red)", "estimado":"var(--ochre2)", "sin subir":"var(--ochre2)"
  };

    '<div class="filtros">'

        + cats.map(c => opt(c,c,fCat)).join("") + '</select>'
      + '<select id="f-tipo">' + opt("","Reservas y gastos",fTipo)
        + opt("Reserva","Solo reservas",fTipo) + opt("Gasto","Solo gastos",fTipo) + '</select>'
      + '<select id="f-est">' + opt("","Cualquier estado",fEstado)

      + '<div class="fig"><div class="fig-k">' + filas.length + ' apuntes</div>'
        + '<div class="fig-v">' + n2(tot) + ' €</div></div>'
      + '<div class="fig"><div class="fig-k">De ello en rands</div>'
        + '<div class="fig-v">R ' + n2(totZ) + '</div></div>'
    + '</div>'

    + '<table class="tdet">'
    + '<colgroup><col class="w-fec"><col><col class="w-zar"><col class="w-eur"></colgroup>'
    + '<thead><tr>'
      + th("fecha","Fecha") + th("concepto","Concepto")
      + '<th class="r">ZAR</th>' + th("importe","Euros","r")
    + '</tr></thead><tbody>'
    + (filas.length ? filas.map(x =>
        '<tr><td class="c-fec">' + fmtCorta(x.fecha) + '</td>'
        + '<td class="c-con">' + esc(x.concepto)

          + (x.estado !== "pagado"

      : '<tr><td colspan="4" style="text-align:center;padding:22px;color:var(--mute)">'

    + '<tr class="total"><td class="c-fec">&nbsp;</td><td class="c-con">Total filtrado</td>'

    + '</tbody></table>'
    + '<div class="fams">'
      + '<span class="cat mov">mov</span> movimiento'
      + '<span class="cat est">est</span> estancia'
      + '<span class="cat exp">exp</span> experiencias'

}

/* Reparto real: cuenta lo que cada uno ha puesto de su bolsillo,
   sea aportando al fondo común o pagando cosas directamente. */
function reparto(){
  const puesto = {}, aport = {}, directo = {};
  const sumar = (o,k,v) => { o[k] = (o[k] || 0) + v; };

  listaGastos().filter(esRecarga).forEach(g => {
    const k = g.pagadoPor || g.quien;
    // Si consta lo que salió del bolsillo, se usa eso: es un dato exacto
    // y no debe depender de ningún tipo de cambio.
    const v = g.aporte != null
      ? aBase(g.aporte, g.monedaAporte || V.monedaBase)
      : aBase(g.importe, g.moneda);
    sumar(aport, k, v);
    sumar(puesto, k, v);
  });
  libro().forEach(x => {
    if(!x.quien || x.quien === "comun") return;
    if(x.estado === "estimado" || x.estado === "pendiente") return;
    sumar(directo, x.quien, aBase(x.importe, x.moneda));
    sumar(puesto,  x.quien, aBase(x.importe, x.moneda));
  });

  const total = Object.values(puesto).reduce((s,v) => s + v, 0);
  const pax   = (V.viajeros || []).length || 1;
  const mitad = total / pax;
  const e = efectivo(), t = tarjeta();
  return { puesto, aport, directo, total, mitad,
           fondoZar: e.mano + t.saldo,
           fondo: (e.mano + t.saldo) / cambio("ZAR") };
}

    try{
      const r = await leerFicheroRepo(rutaGastos(cfg.quien || "alvaro"));
      box.innerHTML = '<div class="msg ok" style="margin-top:10px">Conexión correcta. '
        + (r.contenido.length) + ' gastos en tu fichero.</div>';
    }catch(e){
      box.innerHTML = '<div class="msg bad" style="margin-top:10px">' + esc(e.message) + '</div>';
    }
  };
}

/* ---------------- estado de sincronización ---------------- */
function pintarEstado(){
  const el = document.getElementById("estado");
  if(!navigator.onLine){
    el.className = "estado off";
    el.textContent = "Sin conexión · copia del "
      + (snap.ts ? new Date(snap.ts).toLocaleDateString("es-ES") : "?")
      + (cola.length ? " · " + cola.length + " en espera" : "");
  }else if(cola.length || colaD.length){
    el.className = "estado pend";
    el.textContent = (cola.length + colaD.length) + " sin subir · toca para reintentar";
    el.onclick = async () => { await vaciarCola(); await vaciarColaDiario(); repintar(); };
  }else if(configurado()){
    el.className = "estado";
    el.textContent = "Al día · " + nombreDe(cfg.quien);
  }else{
    el.className = "estado pend";
    el.textContent = "Sin configurar · ve a Ajustes";
  }
}

/* ---------------- arranque ---------------- */
const paneles = {
  hoy:pintarHoy, ruta:pintarRuta, mapa:pintarMapa, diario:pintarDiario, gastos:pintarGastos,
  dinero:pintarDinero, detalle:pintarDetalle, datos:pintarDatos, ajustes:pintarAjustes
};
let actual = "hoy";

function repintar(){
  pintarPlaca();
  paneles[actual]();
  pintarEstado();
}

document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  actual = t.dataset.p;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
  Object.keys(paneles).forEach(k => document.getElementById("p-" + k).hidden = (k !== actual));
  paneles[actual]();
  window.scrollTo({ top:0, behavior:"smooth" });
});

window.addEventListener("online", async () => {
  await vaciarCola(); await vaciarColaDiario(); repintar();
});
window.addEventListener("offline", pintarEstado);

(async function(){
  cargarCfg(); cargarCola(); cargarSnap();
  try{
    await cargarViaje();
  }catch(e){
    document.querySelector(".wrap").innerHTML =
      '<div class="empty" style="margin-top:40px">No se pudo cargar <code>viaje.json</code>.<br>'
      + esc(e.message) + '</div>';
    return;
  }
  pintarCabecera();
  await cargarGastos();
  await cargarDiario();
  await vaciarCola();
  await vaciarColaDiario();
  Object.values(paneles).forEach(f => f());
  document.getElementById("p-hoy").hidden = false;
  pintarEstado();
  setInterval(() => { pintarPlaca(); pintarEstado(); }, 60000);

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  }
})();
</script>
